machine:
  features:
    imageCache:
      localEnabled: true
  disks:
    - device: /dev/sdb # DATA disk
      partitions:
        - mountpoint: /var/lib/longhorn
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - rbind
          - rshared
