apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-external-net
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "mode": "bridge",
      "master": "eth1",
      "ipam": {
        "type": "whereabouts",
        "range": "10.0.50.0/24",
        "gateway": "10.0.50.1"
      }
    }
